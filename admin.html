<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Rafiki Perfumes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#3a0b19;--ink:#24090f;--ivory:#f6ecd6;--bg:#fbf6ec;--card:#fffdf8;--line:#e3d5b5;--muted:#7b6a58;--gold:#c9a45c;--err:#a61e3c;--disp:"Cormorant Garamond",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--brand);color:var(--ivory);padding-top:env(safe-area-inset-top)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap}
.logo{font:700 24px var(--disp);letter-spacing:.16em}.logo small{font:400 13px "DM Sans";letter-spacing:.14em;color:var(--gold);margin-left:10px}
.hd div{display:flex;gap:8px;align-items:center;font-size:14px}.hd a,.hd button{color:var(--ivory);border:1px solid var(--gold);background:none;border-radius:999px;padding:7px 16px;text-decoration:none;font:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin:24px 0 16px}
.tabs button{background:none;border:1px solid var(--ink);border-radius:999px;padding:8px 20px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--gold);border-color:var(--brand)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.th{width:56px;height:70px;border-radius:8px;background:#efe3c3;overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.th img{width:100%;height:100%;object-fit:cover}.grow{flex:1 1 170px}.grow small{display:block;color:var(--muted)}
input,select{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.pr{width:100px}.chk{display:flex;align-items:center;gap:6px;font-size:14px}.chk input{width:auto}
.btn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}.del{color:var(--err)}
.go{background:var(--brand);color:var(--ivory);border:0;border-radius:999px;padding:12px 28px;font:inherit;font-weight:500;cursor:pointer}.go:disabled{opacity:.6}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:660px}.f label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}.full{grid-column:1/-1}
.prev{width:120px;height:150px;border-radius:10px;background:#efe3c3;object-fit:cover;display:none}
.empty{color:var(--muted);padding:24px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.cp{position:relative;aspect-ratio:4/5;border-radius:10px;background:#efe3c3;display:grid;place-items:center;color:var(--muted);font-size:13px;margin-bottom:10px;overflow:hidden}.cp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.note{color:var(--muted);font-size:14px;margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--brand);color:var(--gold);padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:640px){.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap hd"><span class="logo">RAFIKI<small>ADMIN</small></span><div><span id="who"></span><a href="index.html" target="_blank" rel="noopener">View store</a><button id="out">Sign out</button></div></div></header>
<main class="wrap">
<div class="tabs" role="tablist"><button role="tab" data-t="list" aria-selected="true">Products</button><button role="tab" data-t="form" id="tForm" aria-selected="false">Add product</button><button role="tab" data-t="coll" aria-selected="false">Site photos</button></div>
<div id="list"></div>
<div id="coll" hidden></div>
<form id="form" class="f" hidden>
<div><label for="fb">Brand</label><input id="fb" required></div><div><label for="fn">Name</label><input id="fn" required></div>
<div><label for="fc">Category</label><select id="fc"><option value="arabic">Arabic</option><option value="designer">Designer</option><option value="gift">Gift sets</option></select></div>
<div><label for="fg">For</label><select id="fg"><option>Unisex</option><option>Men</option><option>Women</option></select></div>
<div><label for="fm">Size (ml)</label><input id="fm" type="number" min="1" value="100" required></div><div><label for="fp">Price (₺ TL)</label><input id="fp" type="number" min="0" step="0.01" required></div>
<div><label for="ft">Top notes</label><input id="ft"></div><div><label for="fh">Heart notes</label><input id="fh"></div>
<div class="full"><label for="fd">Base notes</label><input id="fd"></div>
<div class="full chk"><input id="fs" type="checkbox" checked><label for="fs" style="margin:0">In stock</label>&nbsp;&nbsp;<input id="fnw" type="checkbox"><label for="fnw" style="margin:0">New arrival</label>&nbsp;&nbsp;<input id="fbs" type="checkbox"><label for="fbs" style="margin:0">Best seller</label></div>
<div class="full"><label for="fi">Photo (leave empty to keep the current one)</label><input id="fi" type="file" accept="image/*"><img class="prev" id="prev" alt="Current photo"></div>
<div class="full"><button class="go" id="save" type="submit">Save product</button> <button class="btn" type="button" id="cancel">Cancel</button></div>
</form>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://bnwblndxsjblqephxjnv.supabase.co","sb_publishable_reqxktF5AnT-PYnMj5DfDw_LnOofuAc");
const $=s=>document.querySelector(s),B="product-photos";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let rows=[],cur=null,tt;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2800)};
const fail=e=>toast((e&&e.message)||"Something went wrong. Try again.");
const tab=t=>{$("#list").hidden=t!=="list";$("#coll").hidden=t!=="coll";$("#form").hidden=t!=="form";document.querySelectorAll("[data-t]").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t))};
const resize=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("Could not read that image.")),"image/jpeg",.85)};i.src=r.result};r.readAsDataURL(f)});
async function upload(f){const b=await resize(f),p=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
  const{error}=await sb.storage.from(B).upload(p,b,{contentType:"image/jpeg"});if(error)throw error;return sb.storage.from(B).getPublicUrl(p).data.publicUrl}
const rmFile=async u=>{const p=u&&u.split("/"+B+"/")[1];if(p)await sb.storage.from(B).remove([p])};

const CK=[["hero","Top of the page"],["arabic","Arabic Oud tile"],["designer","Designer tile"],["gift","Gift Sets tile"],["new","New Arrivals tile"],["story","Our Story section"]];
function drawColl(){$("#coll").innerHTML=`<p class="note">These photos appear on the store: the big picture at the top, the four collection tiles and the Our Story section. Use tall photos for the top and tiles, and a square one for Our Story. A new photo can take up to a minute to show.</p><div class="cg">`+CK.map(([k,l])=>`<div class="cc"><div class="cp"><span>No photo yet</span><img src="${sb.storage.from(B).getPublicUrl("collections/"+k+".jpg").data.publicUrl}?t=${Date.now()}" alt="" onerror="this.remove()"></div><b>${l}</b><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><label class="btn">Upload photo<input type="file" accept="image/*" hidden data-cphoto="${k}"></label><button class="btn del" data-crm="${k}">Remove</button></div></div>`).join("")+`</div>`}
async function load(){const{data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error)return fail(error);rows=data;draw()}
function draw(){
  $("#list").innerHTML=rows.length?rows.map(x=>`<div class="row"><div class="th">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:"No photo"}</div>
  <div class="grow"><b>${esc(x.name)}</b><small>${esc(x.brand)} &middot; ${esc(x.category)} &middot; ${x.size_ml} ml</small></div>
  <input class="pr" type="number" min="0" step="0.01" value="${x.price}" data-f="price" data-id="${x.id}" aria-label="Price for ${esc(x.name)}">
  <label class="chk"><input type="checkbox" data-f="in_stock" data-id="${x.id}" ${x.in_stock?"checked":""}>In stock</label>
  <label class="chk"><input type="checkbox" data-f="is_new" data-id="${x.id}" ${x.is_new?"checked":""}>New</label>
  <label class="chk"><input type="checkbox" data-f="is_best" data-id="${x.id}" ${x.is_best?"checked":""}>Best</label>
  <label class="btn">${x.image_url?"Change photo":"Add photo"}<input type="file" accept="image/*" hidden data-photo="${x.id}"></label>
  <button class="btn" data-edit="${x.id}">Edit</button><button class="btn del" data-del="${x.id}">Delete</button></div>`).join(""):`<p class="empty">No products yet. Open Add product to create your first one.</p>`;
}
function fill(x){cur=x;$("#tForm").textContent=x?"Edit product":"Add product";
  $("#fb").value=x?.brand||"";$("#fn").value=x?.name||"";$("#fc").value=x?.category||"arabic";$("#fg").value=x?.gender||"Unisex";$("#fm").value=x?.size_ml||100;$("#fp").value=x?.price??"";
  $("#ft").value=x?.top_notes||"";$("#fh").value=x?.heart_notes||"";$("#fd").value=x?.base_notes||"";
  $("#fs").checked=x?x.in_stock:true;$("#fnw").checked=!!x?.is_new;$("#fbs").checked=!!x?.is_best;$("#fi").value="";
  $("#prev").style.display=x?.image_url?"block":"none";$("#prev").src=x?.image_url||"";tab("form")}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.t){d.t==="form"?fill(null):(tab(d.t),d.t==="coll"&&drawColl())}
  else if(d.edit)fill(rows.find(r=>r.id==d.edit));
  else if(d.crm){const{error}=await sb.storage.from(B).remove(["collections/"+d.crm+".jpg"]);if(error)return fail(error);toast("Photo removed");drawColl()}
  else if(t.id==="cancel")tab("list");
  else if(t.id==="out")sb.auth.signOut();
  else if(d.del){if(!t.dataset.arm){t.dataset.arm=1;t.textContent="Confirm delete";return}
    const x=rows.find(r=>r.id==d.del);const{error}=await sb.from("products").delete().eq("id",x.id);
    if(error)return fail(error);try{await rmFile(x.image_url)}catch(_){}toast("Product deleted");load()}
});
document.addEventListener("change",async e=>{
  const t=e.target,d=t.dataset;
  try{
    if(d.f){const v=t.type==="checkbox"?t.checked:Math.max(0,+t.value||0);
      const{error}=await sb.from("products").update({[d.f]:v}).eq("id",d.id);if(error)throw error;toast("Saved")}
    else if(d.photo&&t.files[0]){const x=rows.find(r=>r.id==d.photo);toast("Uploading photo...");
      const url=await upload(t.files[0]);const{error}=await sb.from("products").update({image_url:url}).eq("id",x.id);if(error)throw error;
      try{await rmFile(x.image_url)}catch(_){}toast("Photo updated");load()}
    else if(d.cphoto&&t.files[0]){toast("Uploading photo...");const b=await resize(t.files[0]);const{error}=await sb.storage.from(B).upload("collections/"+d.cphoto+".jpg",b,{contentType:"image/jpeg",upsert:true,cacheControl:"60"});if(error)throw error;toast("Collection photo saved");drawColl()}
  }catch(err){fail(err);load()}
});
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("#save");b.disabled=true;b.textContent="Saving...";
  try{
    const f=$("#fi").files[0],p={brand:$("#fb").value.trim(),name:$("#fn").value.trim(),category:$("#fc").value,gender:$("#fg").value,size_ml:+$("#fm").value,price:+$("#fp").value,
      top_notes:$("#ft").value.trim(),heart_notes:$("#fh").value.trim(),base_notes:$("#fd").value.trim(),in_stock:$("#fs").checked,is_new:$("#fnw").checked,is_best:$("#fbs").checked};
    const old=cur?.image_url;if(f)p.image_url=await upload(f);
    const{error}=cur?await sb.from("products").update(p).eq("id",cur.id):await sb.from("products").insert(p);if(error)throw error;
    if(f&&old)try{await rmFile(old)}catch(_){}
    toast(cur?"Product saved":"Product added");tab("list");load();
  }catch(err){fail(err)}finally{b.disabled=false;b.textContent="Save product"}
});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.replace("admin-login.html")});
sb.auth.getSession().then(({data})=>{if(!data.session)location.replace("admin-login.html");else{$("#who").textContent=data.session.user.email;load()}});
</script>
</body>
</html>
